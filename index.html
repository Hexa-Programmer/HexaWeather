<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HexaWeather</title>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="theme-day"> <div id="loadingScreen">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <h1>Welcome to HexaWeather</h1>
</div>

<div class="container" id="appContainer">

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>HexaWeather</h2>
        </div>

        <div class="nav-menu">
            <div id="navHome" class="nav-item active" onclick="showDashboard()">
                Home
            </div>
        </div>
        
        <div class="search-container">
            <input id="search" placeholder="Search city..." autocomplete="off" />
            <div id="suggestions" class="suggestions-dropdown"></div>
        </div>

        <div id="recent" class="recent-container"></div>
    </div>

    <div class="editor">

        <div id="dashboardCard" class="display-card dashboard-view">
            <div class="dashboard-header">
                <button class="back-btn mobile-menu-btn" onclick="closeWeather()">‹ Search</button>
                <h1>Overview</h1>
                <p>Welcome back to your weather hub</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <span class="stat-label">Frequent Cities Avg</span>
                    <span class="stat-value" id="statAvgTemp">--°C</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Top Searched</span>
                    <span class="stat-value" id="statMostSearched">--</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Saved Searches</span>
                    <span class="stat-value" id="statTotalCities">0</span>
                </div>
            </div>

            <div class="dashboard-section-title">
                <h3>Frequently Searched Cities</h3>
            </div>

            <div id="frequentCitiesGrid" class="frequent-grid"></div>

            
            <div class="dashboard-illustration">
                <svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="210" cy="80" r="45" fill="url(#sunGradient)" opacity="0.9" class="animate-spin-slow" />
                    <g class="animate-float">
                        <path d="M110 140 C110 120 125 105 145 105 C152 105 158 107 163 111 C170 95 186 85 205 85 C230 85 250 105 250 130 C258 130 265 137 265 145 C265 153 258 160 250 160 L110 160 C96 160 85 149 85 135 C85 122 95 111 108 110 C109 126 110 140 110 140 Z" fill="url(#cloudGradient)" />
                    </g>
                    <g opacity="0.6" class="animate-float-delayed">
                        <path d="M60 170 C60 158 70 148 82 148 C86 148 90 149 93 152 C98 140 110 132 124 132 C142 132 156 146 156 164 C162 164 167 169 167 175 C167 181 162 186 156 186 L60 186 C50 186 42 178 42 168 C42 158 50 150 60 150 Z" fill="url(#cloudGradientAlt)" />
                    </g>
                    <defs>
                        <linearGradient id="sunGradient" x1="165" y1="35" x2="255" y2="125" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FCD34D" />
                            <stop offset="1" stop-color="#F59E0B" />
                        </linearGradient>
                        <linearGradient id="cloudGradient" x1="85" y1="85" x2="265" y2="160" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#FFFFFF" stop-opacity="0.8" />
                            <stop offset="1" stop-color="#E0F2FE" stop-opacity="0.4" />
                        </linearGradient>
                        <linearGradient id="cloudGradientAlt" x1="42" y1="132" x2="167" y2="186" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#BAE6FD" stop-opacity="0.6" />
                            <stop offset="1" stop-color="#7DD3FC" stop-opacity="0.2" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>


        <div id="weatherCard" class="display-card weather-view" style="display: none;">
            <div class="editor-header">
                <button class="back-btn" onclick="closeWeather()">‹ Search</button>
                <button class="delete-btn" onclick="clearHistory()">Clear History</button>
            </div>

            <div class="weather-info">
                <h1 id="city">--</h1>
                <div class="temp-wrapper">
                    <div id="weatherIcon" class="weather-icon">✨</div>
                    <div id="temp">--°C</div>
                </div>
                <div id="desc">Loading...</div>
            </div>

            <div id="forecast"></div>
        </div>
    </div>

</div>

</body>
</html>
